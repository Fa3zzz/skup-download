<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sküp</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0F1115;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.18);
      object-fit: cover;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    p {
      color: rgba(255,255,255,0.68);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 42px;
    }

    .button {
      display: block;
      width: 100%;
      text-decoration: none;
      padding: 18px 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 600;
      transition: all 0.18s ease;
    }

    .button:hover {
      transform: scale(1.02);
    }

    .android {
      background: #22C55E;
      color: black;
    }

    .ios {
      background: #1A1D24;
      color: white;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .footer {
      margin-top: 28px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">

    <img
      class="logo"
      src="https://i.imgur.com/Q9qFt3m.png"
      alt="Sküp Logo"
    />

    <h1>Sküp</h1>

    <p>
      Meet new people without the pressure.
    </p>

    <a
      class="button android"
      href="https://play.google.com/store/apps/details?id=com.aflowt.skup"
      target="_blank"
    >
      Download for Android
    </a>

    <a
      class="button ios"
      href="https://apps.apple.com/in/app/skúp/id6762100151"
      target="_blank"
    >
      Download for iPhone
    </a>

    <div class="footer">
      © Sküp
    </div>

  </div>
</body>
</html>
